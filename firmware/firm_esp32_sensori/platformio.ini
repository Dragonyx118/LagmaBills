[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    https://github.com/rfetick/MPU6050_light.git

build_flags =
    -DCORE_DEBUG_LEVEL=0