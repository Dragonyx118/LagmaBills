<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPi Temp Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --text: #e8e8f0;
    --muted: #555568;
    --green: #4ade80;
    --yellow: #fbbf24;
    --orange: #f97316;
    --red: #ef4444;
    --green-dim: rgba(74,222,128,0.1);
    --yellow-dim: rgba(251,191,36,0.1);
    --orange-dim: rgba(249,115,22,0.1);
    --red-dim: rgba(239,68,68,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(74,222,128,0.04) 0%, transparent 70%);
    pointer-events: none;
    transition: background 0.8s ease;
    z-index: 0;
  }

  body.warm::before { background: radial-gradient(circle, rgba(251,191,36,0.05) 0%, transparent 70%); }
  body.hot::before { background: radial-gradient(circle, rgba(249,115,22,0.06) 0%, transparent 70%); }
  body.critical::before { background: radial-gradient(circle, rgba(239,68,68,0.07) 0%, transparent 70%); }

  .container {
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 2.5rem;
  }

  .logo {
    width: 36px; height: 36px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
  }

  .logo svg { width: 18px; height: 18px; }

  header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .main-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
  }

  .main-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  }

  .input-section {
    display: flex;
    gap: 10px;
    margin-bottom: 2rem;
  }

  .input-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  input[type="number"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input[type="number"]:focus {
    border-color: var(--muted);
  }

  .btn {
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }

  .temp-display {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 1.5rem;
  }

  .big-number {
    font-size: 80px;
    font-weight: 800;
    line-height: 1;
    transition: color 0.6s ease;
    font-variant-numeric: tabular-nums;
  }

  .temp-unit {
    font-size: 32px;
    font-weight: 400;
    color: var(--muted);
    padding-bottom: 10px;
  }

  .status-pill {
    margin-left: auto;
    align-self: center;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.5s ease;
    font-family: 'JetBrains Mono', monospace;
  }

  .gauge-track {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 0.5rem;
  }

  .gauge-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1), background 0.6s ease;
  }

  .gauge-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 2rem;
  }

  .zones-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .zone-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: border-color 0.4s, background 0.4s;
    position: relative;
    overflow: hidden;
  }

  .zone-item.active {
    border-color: currentColor;
  }

  .zone-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }

  .zone-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
  }

  .zone-range {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .zone-desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.4;
  }

  .cmd-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .cmd-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 4px;
  }

  .cmd-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text);
  }

  .copy-btn {
    background: var(--border);
    border: none;
    border-radius: 6px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  .copy-btn:hover { background: #2a2a3a; color: var(--text); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .pulse { animation: pulse 2s infinite; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
      </svg>
    </div>
    <h1>RPi Temp Monitor</h1>
  </header>

  <div class="main-card">
    <div class="input-label">Temperatura (°C)</div>
    <div class="input-section">
      <input type="number" id="tempIn" value="45" min="0" max="100" placeholder="es. 55" />
      <button class="btn" onclick="update()">Aggiorna</button>
    </div>

    <div class="temp-display">
      <span class="big-number" id="bigNum">45</span>
      <span class="temp-unit">°C</span>
      <span class="status-pill" id="pill">OK</span>
    </div>

    <div class="gauge-track">
      <div class="gauge-fill" id="gauge" style="width:0%"></div>
    </div>
    <div class="gauge-labels">
      <span>0°C</span>
      <span>fresco</span>
      <span>caldo</span>
      <span>85°C</span>
    </div>

    <div class="zones-grid">
      <div class="zone-item" id="z0">
        <div class="zone-title" style="color:#4ade80">
          <span class="zone-dot" style="background:#4ade80"></span>Normale
        </div>
        <div class="zone-range">0 – 49°C</div>
        <div class="zone-desc">Il Pi sta benissimo.</div>
      </div>
      <div class="zone-item" id="z1">
        <div class="zone-title" style="color:#fbbf24">
          <span class="zone-dot" style="background:#fbbf24"></span>Tiepido
        </div>
        <div class="zone-range">50 – 59°C</div>
        <div class="zone-desc">Normale sotto carico.</div>
      </div>
      <div class="zone-item" id="z2">
        <div class="zone-title" style="color:#f97316">
          <span class="zone-dot" style="background:#f97316"></span>Caldo
        </div>
        <div class="zone-range">60 – 69°C</div>
        <div class="zone-desc">Considera un dissipatore.</div>
      </div>
      <div class="zone-item" id="z3">
        <div class="zone-title" style="color:#ef4444">
          <span class="zone-dot" style="background:#ef4444"></span>Critico
        </div>
        <div class="zone-range">70°C+</div>
        <div class="zone-desc">Metti subito una ventola!</div>
      </div>
    </div>
  </div>

  <div class="cmd-card">
    <div>
      <div class="cmd-label">Comando sul Raspberry</div>
      <div class="cmd-text">vcgencmd measure_temp</div>
    </div>
    <button class="copy-btn" onclick="copy()">copia</button>
  </div>
</div>

<script>
const zones = [
  { max:49, color:'#4ade80', bg:'rgba(74,222,128,0.1)', label:'OK', cls:'', bodyCls:'' },
  { max:59, color:'#fbbf24', bg:'rgba(251,191,36,0.1)',  label:'TIEPIDO', cls:'warm', bodyCls:'warm' },
  { max:69, color:'#f97316', bg:'rgba(249,115,22,0.1)',  label:'CALDO', cls:'hot', bodyCls:'hot' },
  { max:999,color:'#ef4444', bg:'rgba(239,68,68,0.1)',   label:'CRITICO', cls:'critical', bodyCls:'critical' },
];

function getZone(t) { return zones.find(z => t <= z.max); }

function update() {
  const t = Math.min(100, Math.max(0, parseInt(document.getElementById('tempIn').value) || 0));
  const z = getZone(t);
  const pct = Math.min(100, Math.round((t / 85) * 100));

  document.getElementById('bigNum').textContent = t;
  document.getElementById('bigNum').style.color = z.color;

  const pill = document.getElementById('pill');
  pill.textContent = z.label;
  pill.style.background = z.bg;
  pill.style.color = z.color;

  document.getElementById('gauge').style.width = pct + '%';
  document.getElementById('gauge').style.background = z.color;

  document.body.className = z.bodyCls;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('z' + i);
    el.classList.remove('active');
    el.style.background = 'var(--bg)';
    el.style.borderColor = 'var(--border)';
  }

  const activeIdx = zones.indexOf(z);
  const activeEl = document.getElementById('z' + activeIdx);
  activeEl.classList.add('active');
  activeEl.style.background = z.bg;
  activeEl.style.borderColor = z.color;
}

function copy() {
  navigator.clipboard.writeText('vcgencmd measure_temp');
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'copiato!';
  setTimeout(() => btn.textContent = 'copia', 1500);
}

update();
</script>
</body>
</html>
