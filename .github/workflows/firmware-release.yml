name: Aggiorna Release Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware_esp32/**' # Modificato da 'firmware/**' a 'firmware_esp32/**'
  workflow_dispatch: # Permette di avviarlo manualmente da GitHub Actions

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per creare o aggiornare le release
    steps:
      - uses: actions/checkout@v4

      - name: Crea zip firmware motori
        run: |
          cd firmware_esp32/firm_esp32_motori
          zip -r ../../firm_esp32_motori.zip . -x ".pio/*" -x ".vscode/*"

      - name: Crea zip firmware sensori
        run: |
          cd firmware_esp32/firm_esp32_sensori
          zip -r ../../firm_esp32_sensori.zip . -x ".pio/*" -x ".vscode/*"

      - name: Pubblica/aggiorna release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-firmware
          name: "Firmware ESP32 (Latest version)"
          body: "Aggiornato automaticamente ad ogni push su main che modifica firmware_esp32/. Commit: ${{ github.sha }}"
          files: |
            firm_esp32_motori.zip
            firm_esp32_sensori.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
